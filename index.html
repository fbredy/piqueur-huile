<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunes Wheel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --item-bg: #f8f9fa;
            --border-color: #dddddd;
            --shadow: rgba(0,0,0,0.3);
        }

        body.dark-mode {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --container-bg: #0f3460;
            --text-primary: #e8e8e8;
            --text-secondary: #b8b8b8;
            --item-bg: #1a3a52;
            --border-color: #2a5a7a;
            --shadow: rgba(0,0,0,0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 1200px;
            width: 100%;
            position: relative;
            transition: background 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 30px;
            transition: color 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #333;
            position: relative;
            transition: transform 2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
        }

        .spin-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
        }

        .list-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        #listSelect {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--item-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
        }

        #newListBtn, #deleteListBtn {
            padding: 10px 15px;
            font-size: 18px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--item-bg);
            cursor: pointer;
            transition: transform 0.2s, background 0.3s ease;
        }

        #newListBtn:hover, #deleteListBtn:hover {
            transform: scale(1.05);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #nameInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--item-bg);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        #addBtn {
            padding: 12px 30px;
            font-size: 16px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #addBtn:hover {
            background: #27ae60;
        }

        .names-list {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            transition: border-color 0.3s ease;
        }

        .name-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: var(--item-bg);
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .name-text {
            flex: 1;
            font-size: 16px;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .name-item.hidden {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .name-text {
            flex: 1;
            font-size: 16px;
        }

        .show-btn {
            padding: 5px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .show-btn:hover {
            background: #2980b9;
        }

        .hide-name-btn {
            padding: 5px 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
        }

        .hide-name-btn:hover {
            background: #e67e22;
        }

        .remove-btn {
            padding: 5px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .restart-btn {
            margin-top: 15px;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            background: #e67e22;
        }

        .result-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--container-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            z-index: 1000;
            text-align: center;
            min-width: 400px;
            transition: background 0.3s ease;
        }

        .result-popup.show {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .result-popup h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .result-name {
            font-size: 36px;
            font-weight: bold;
            color: var(--text-primary);
            margin: 20px 0;
            transition: color 0.3s ease;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .result-btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .keep-btn {
            background: #2ecc71;
            color: white;
        }

        .hide-btn {
            background: #e74c3c;
            color: white;
        }

        .result-btn:hover {
            opacity: 0.9;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .wheel-container {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle">🌙</button>
        <h1>Thunes Wheel 🎡</h1>

        <div class="main-content">
            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <canvas id="wheel" width="400" height="400"></canvas>
                </div>
                <button class="spin-btn" id="spinBtn">SPIN</button><button class="restart-btn" id="restartBtn">RESTART ALL</button>
            </div>

            <div class="controls-section">
                <div class="list-selector">
                    <select id="listSelect"></select>
                    <button id="newListBtn" title="New List">➕</button>
                    <button id="deleteListBtn" title="Delete List">🗑️</button>
                </div>

                <div class="input-group">
                    <input type="text" id="nameInput" placeholder="Enter a name...">
                    <button id="addBtn">Add</button>
                </div>

                <div class="names-list" id="namesList"></div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="result-popup" id="resultPopup">
        <h2>🎉 Winner!</h2>
        <div class="result-name" id="resultName"></div>
        <div class="result-buttons">
            <button class="result-btn keep-btn" id="keepBtn">Keep on Wheel</button>
            <button class="result-btn hide-btn" id="hideBtn">Hide from Wheel</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
